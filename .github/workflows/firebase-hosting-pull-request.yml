name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Test asset versioning and Field Notes build
        run: python3 -m unittest discover -s tests
      - name: Verify Field Notes are built
        run: python3 scripts/build-notes.py --check
      - name: Verify hosting copies
        run: python3 scripts/sync-public.py --check
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NICOLASCL_DEV_WEBSITE }}
          projectId: nicolascl-dev-website
